name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: unittest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with the lab extra
        # The lab extra pulls numpy/scipy/scikit-learn/onnxruntime/onnx/tokenizers,
        # which is enough for the contract, web and preset tests. Torch (the adapt
        # extra) is intentionally not installed: no test imports it.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[lab]'

      - name: Run tests
        run: python -m unittest discover -s tests -v
